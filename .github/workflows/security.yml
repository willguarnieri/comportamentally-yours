name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main]
  schedule:
    # Executa toda segunda-feira às 9h (horário de Brasília)
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: |
          echo "## Relatório de Segurança" >> $GITHUB_STEP_SUMMARY
          echo "Data: $(date '+%d/%m/%Y %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          bun audit 2>&1 | tee audit-report.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-report
          path: audit-report.txt
          retention-days: 30

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify dist output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERRO: dist/index.html não encontrado"
            exit 1
          fi
          echo "Build OK — arquivos gerados:"
          ls -lh dist/
